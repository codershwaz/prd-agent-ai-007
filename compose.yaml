services:
  # app:
  #   ports:
  #     - 8000:8000
  #     - 3000:8000
  #   image: python:3.10.21-alpine3.24
  #   command: python -m http.server 8000

  # app2:
  #   ports:
  #     - 8001:8000
  #     - 3001:8000
  #   image: python:3.13.15-bookworm
  #   command: python -m http.server 8000

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    ports:
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/src:/app
    environment:
      - PORT=8000
      - MY_PROJECT=Hello World
    env_file:
      - ./backend/.env.sample
    develop:
      watch:
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/backend.Dockerfile
        - action: restart
          path: ./backend/src


  app:
    build:
      context: ./static_html
      dockerfile: static.Dockerfile
    ports:
      - 8000:8000
      - 3000:8000
    command: python -m http.server 8000
    volumes:
      - ./static_html/src:/app